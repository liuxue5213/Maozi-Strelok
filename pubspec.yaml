name: ballistics_calculator
description: A professional 3D external ballistics calculator with built-in weapon / ammunition / bullet database and customization system.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  fl_chart: ^0.68.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  # Device sensors for auto-filling shooting conditions. Version-pinned (no
  # caret drift) because their APIs change between majors and CI is the only
  # place that compiles them.
  geolocator: ^13.0.1
  flutter_compass: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
